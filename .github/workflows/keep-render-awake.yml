name: Keep Render Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render health endpoint
        run: |
          URL="https://dreamforlove-api.onrender.com/health"
          echo "Pinging: $URL"

          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$URL" || true)
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Render is awake ✅"
              exit 0
            fi
            sleep 10
          done

          echo "Render did not respond 200 in time ❌"
          exit 1
